<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2.5D Ocean Waves - Stormy Sky (v5)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(5px);
            font-size: 14px;
            z-index: 10;
        }
        .mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
            transition: 0.2s;
        }
        .mode-toggle:hover { background: rgba(0,0,0,0.9); transform: scale(1.02); }
        #stormBtn { top: 80px; right: 20px; background: #331100; }
        @media (max-width: 600px) {
            .mode-toggle { font-size: 12px; padding: 8px 14px; top: 12px; right: 12px; }
            #stormBtn { top: 60px; font-size: 11px; padding: 6px 12px; }
            #info { font-size: 10px; bottom: 10px; background: rgba(0,0,0,0.3); opacity: 0.7; }
        }
        #debug {
            position: absolute;
            top: 60px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: lime;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 8px;
            z-index: 20;
            pointer-events: none;
            border-radius: 4px;
            display: none;
        }
        .dev-inline { display:block; font-family: monospace; font-size:11px; color:#ddd; margin-bottom:6px; }
        .lil-gui { 
            position: fixed !important; 
            top: 12px !important; 
            right: 12px !important; 
            z-index: 1000 !important; 
            pointer-events: auto !important; 
            width: 280px !important; 
            max-width: calc(100vw - 24px) !important;
            max-height: calc(100vh - 24px) !important;
            overflow-y: auto !important;
            background: rgba(0,0,0,0.8) !important;
            border: 1px solid rgba(255,255,255,0.2) !important;
            border-radius: 8px !important;
        }
        .lil-gui .lil-gui {
            position: relative !important;
            top: auto !important;
            right: auto !important;
            width: 100% !important;
            margin: 0 !important;
            border: none !important;
            background: transparent !important;
        }
        @media (min-width:900px) { .mode-toggle { left:20px; right:auto; top:20px; } #stormBtn { left:20px; right:auto; top:80px; } }
        @media (max-width:600px) { .lil-gui { display:none !important; } }
        
        /* Tablet GUI positioning */
        @media (min-width: 601px) and (max-width: 1024px) {
            .lil-gui { top: 20px !important; left: 20px !important; right: auto !important; }
        }
        
        /* Control Hints Styles */
        .control-hints {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            z-index: 999;
            transition: opacity 0.3s ease;
            max-width: 200px;
        }
        
        .control-hints:hover {
            opacity: 0.7;
        }
        
        .hint-icon {
            position: relative;
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Mouse Icon */
        .mouse-icon {
            position: relative;
            width: 20px;
            height: 28px;
        }
        
        .mouse-body {
            width: 20px;
            height: 28px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .mouse-wheel {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 1px;
            animation: mouseScroll 2s ease-in-out infinite;
        }
        
        .mouse-click {
            position: absolute;
            top: -5px;
            left: 2px;
            width: 8px;
            height: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px 4px 0 0;
            background: rgba(255, 255, 255, 0.1);
            animation: mouseClick 3s ease-in-out infinite;
        }
        
        /* Touch Icon */
        .touch-icon {
            position: relative;
            width: 24px;
            height: 24px;
        }
        
        .finger {
            position: absolute;
            width: 8px;
            height: 12px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            top: 6px;
            left: 6px;
            animation: touchMove 3s ease-in-out infinite;
        }
        
        .finger-2 {
            left: 16px;
            animation-delay: 0.1s;
            animation-name: touchMove2;
        }
        
        /* Tablet Icon */
        .tablet-icon {
            position: relative;
            width: 28px;
            height: 20px;
        }
        
        .tablet-body {
            width: 28px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .tablet-finger {
            position: absolute;
            width: 6px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            top: 6px;
            left: 8px;
            animation: tabletTouch 3s ease-in-out infinite;
        }
        
        .tablet-finger-2 {
            left: 16px;
            animation-delay: 0.2s;
            animation-name: tabletTouch2;
        }
        
        /* Hybrid Icon (Mouse + Touch) */
        .hybrid-icon {
            position: relative;
            width: 32px;
            height: 28px;
        }
        
        .hybrid-mouse {
            position: absolute;
            width: 16px;
            height: 22px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            left: 0;
            top: 3px;
        }
        
        .hybrid-touch {
            position: absolute;
            width: 12px;
            height: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.05);
            right: 0;
            top: 0;
        }
        
        .hybrid-finger {
            position: absolute;
            width: 4px;
            height: 6px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            top: 5px;
            left: 2px;
            animation: hybridTouch 2.5s ease-in-out infinite;
        }
        
        .hint-text {
            line-height: 1.3;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
        }
        
        /* Animations */
        @keyframes mouseScroll {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(3px); }
        }
        
        @keyframes mouseClick {
            0%, 90%, 100% { background: rgba(255, 255, 255, 0.1); }
            5%, 15% { background: rgba(255, 255, 255, 0.4); }
        }
        
        @keyframes touchMove {
            0%, 100% { transform: translate(0, 0); opacity: 0.8; }
            50% { transform: translate(8px, -4px); opacity: 1; }
        }
        
        @keyframes touchMove2 {
            0%, 100% { transform: translate(0, 0); opacity: 0.8; }
            50% { transform: translate(-8px, -4px); opacity: 1; }
        }
        
        @keyframes tabletTouch {
            0%, 100% { transform: translate(0, 0); opacity: 0.8; }
            50% { transform: translate(6px, -2px); opacity: 1; }
        }
        
        @keyframes tabletTouch2 {
            0%, 100% { transform: translate(0, 0); opacity: 0.8; }
            50% { transform: translate(-6px, -2px); opacity: 1; }
        }
        
        @keyframes hybridTouch {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* Responsive layout for small screens */
        @media (max-width: 480px) {
            .control-hints {
                bottom: 20px; /* align กับ info bar */
                right: 15px; /* วางขวาให้ไม่ทับ info bar */
                top: auto; /* ยกเลิก top positioning */
                left: auto; /* ยกเลิก left positioning */
                padding: 8px 10px;
                font-size: 10px;
                max-width: 140px;
                flex-direction: column; /* เปลี่ยนเป็น column */
                text-align: center;
                gap: 8px;
                background: rgba(0,0,0,0.3); /* ลด opacity เหมือน info bar */
                opacity: 0.7; /* เพิ่ม opacity ทั้งอิลิเมนต์ */
            }
            
            .hint-icon {
                min-width: auto;
                height: 24px;
                margin: 0 auto;
            }
            
            .hint-text {
                font-size: 9px;
                line-height: 1.2;
                text-align: center;
            }
        }
        
        /* Medium screens adjustment */
        @media (max-width: 768px) and (min-width: 481px) {
            .control-hints {
                bottom: 20px; /* align กับ info bar เหมือน mobile */
                right: 15px;
                padding: 10px 14px;
                font-size: 11px;
                max-width: 180px;
                background: rgba(0,0,0,0.3); /* ใส่ background เหมือน mobile */
                opacity: 0.7; /* ใส่ opacity เหมือน mobile */
            }
        }
    </style>

<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.18/dist/lil-gui.esm.min.js';

        const debugDiv = document.getElementById('debug');
        
        // Debounced log function to prevent reflow
        let logTimeout;
        function log(msg) { 
            console.log(msg); 
            if(debugDiv) {
                clearTimeout(logTimeout);
                logTimeout = setTimeout(() => {
                    debugDiv.textContent = msg;
                }, 16); // ~60fps
            }
        }

        // Performance and behavior configuration
        const CONFIG = {
            ocean: {
                segments: window.innerWidth < 768 ? 100 : 200, // Mobile optimization
                waveComplexity: window.innerWidth < 768 ? 4 : 8
            },
            fish: {
                maxCount: window.innerWidth < 768 ? 8 : 15,
                turnSpeed: 0.055,
                targetThreshold: 3.8,
                swimBob: 0.007
            },
            particles: {
                count: window.innerWidth < 768 ? 800 : 1800
            },
            rain: {
                count: window.innerWidth < 768 ? 600 : 1200,
                fallSpeed: 4
            }
        };
        
        // Initialize control hints based on device
        function initControlHints() {
            const mouseIcon = document.getElementById('mouseIcon');
            const touchIcon = document.getElementById('touchIcon');
            const tabletIcon = document.getElementById('tabletIcon');
            const hybridIcon = document.getElementById('hybridIcon');
            const pcHint = document.getElementById('pcHint');
            const mobileHint = document.getElementById('mobileHint');
            const tabletHint = document.getElementById('tabletHint');
            const hybridHint = document.getElementById('hybridHint');
            
            // Enhanced device detection
            const hasTouch = 'ontouchstart' in window;
            const hasMouse = window.matchMedia('(pointer: fine)').matches;
            const screenWidth = window.innerWidth;
            const userAgent = navigator.userAgent.toLowerCase();
            
            // Device classification
            let deviceType = 'desktop';
            
            if (hasTouch && hasMouse) {
                // Hybrid device (touch laptop, surface, etc.)
                deviceType = 'hybrid';
            } else if (hasTouch) {
                if (screenWidth >= 768 && screenWidth <= 1024) {
                    // Tablet range
                    deviceType = 'tablet';
                } else if (screenWidth < 768) {
                    // Mobile phone
                    deviceType = 'mobile';
                } else {
                    // Large touch screen
                    deviceType = 'tablet';
                }
            } else {
                // Traditional desktop/laptop
                deviceType = 'desktop';
            }
            
            // Override for specific devices
            if (userAgent.includes('ipad') || userAgent.includes('tablet')) {
                deviceType = 'tablet';
            }
            
            // Hide all icons and hints first
            [mouseIcon, touchIcon, tabletIcon, hybridIcon].forEach(icon => {
                if (icon) icon.style.display = 'none';
            });
            [pcHint, mobileHint, tabletHint, hybridHint].forEach(hint => {
                if (hint) hint.style.display = 'none';
            });
            
            // Show appropriate icon and hint
            switch (deviceType) {
                case 'desktop':
                    if (mouseIcon && pcHint) {
                        mouseIcon.style.display = 'block';
                        pcHint.style.display = 'block';
                    }
                    break;
                case 'mobile':
                    if (touchIcon && mobileHint) {
                        touchIcon.style.display = 'block';
                        mobileHint.style.display = 'block';
                    }
                    break;
                case 'tablet':
                    if (tabletIcon && tabletHint) {
                        tabletIcon.style.display = 'block';
                        tabletHint.style.display = 'block';
                    }
                    break;
                case 'hybrid':
                    if (hybridIcon && hybridHint) {
                        hybridIcon.style.display = 'block';
                        hybridHint.style.display = 'block';
                    }
                    break;
            }
            
            // Auto-hide hints after user interaction
            let interactionCount = 0;
            const hints = document.getElementById('controlHints');
            
            const hideHints = () => {
                interactionCount++;
                if (interactionCount > 3) {
                    hints.style.opacity = '0.3';
                    setTimeout(() => {
                        if (hints.style.opacity === '0.3') {
                            hints.style.display = 'none';
                        }
                    }, 3000);
                }
            };
            
            // Listen for user interactions
            document.addEventListener('mousedown', hideHints);
            document.addEventListener('touchstart', hideHints);
            document.addEventListener('wheel', hideHints);
            
            // Debug log for development
            console.log(`Device detected: ${deviceType} (touch: ${hasTouch}, mouse: ${hasMouse}, width: ${screenWidth})`);
        }

        // Movement bounds and buoy position for fish
        const BOUNDS = { x: { min: -24, max: 24 }, z: { min: -22, max: 22 }, y: { min: -7, max: -1.5 } };

        // 聚: Buoy / Lighthouse position — fish will swim around this point
        const BUOY_POS = new THREE.Vector3(5, -2.5, -4);

        // ========== 1. OceanPlane (คลื่น) ==========
        class OceanPlane {
            constructor(width = 24, depth = 24, segments = CONFIG.ocean.segments) {
                this.geometry = this._createGeometry(width, depth, segments);
                this.material = this._createMaterial();
                this.mesh = new THREE.Mesh(this.geometry, this.material);
            }
            _createGeometry(w, d, seg) {
                const geo = new THREE.PlaneGeometry(w, d, seg, seg);
                const pos = geo.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    const x = pos[i], y = pos[i+1];
                    pos[i] = x;
                    pos[i+1] = 0;
                    pos[i+2] = y;
                }
                geo.attributes.position.needsUpdate = true;
                if (geo.attributes.normal) geo.deleteAttribute('normal');
                return geo;
            }
            _createMaterial() {
                const uniforms = {
                    uTime: { value: 0 },
                    uColorDeep: { value: new THREE.Color(0x023e5a) },
                    uColorMid: { value: new THREE.Color(0x0a6b8e) },
                    uColorShallow: { value: new THREE.Color(0x3b9ec7) },
                    uColorFoam: { value: new THREE.Color(0xe0f7ff) }
                };
                const vs = `
                    uniform float uTime;
                    varying float vElevation;
                    varying vec3 vNormal;
                    void main() {
                        vec3 pos = position;
                        float x = pos.x, z = pos.z;
                        float y = 0.0;
                        
                        // Primary waves (always computed)
                        y += sin(x * 0.55 + uTime) * 0.22;
                        y += sin(x * 1.25 - uTime * 1.4) * 0.12;
                        y += sin(z * 0.8 + uTime * 0.9) * 0.18;
                        y += sin(z * 1.8 + uTime * 1.2) * 0.1;
                        
                        // Secondary waves (conditional for mobile performance)
                        ${CONFIG.ocean.waveComplexity >= 8 ? `
                        y += sin((x * 0.9 + z * 0.9) * 1.1 + uTime * 1.6) * 0.13;
                        y += sin((x * 1.7 - z * 1.3) * 0.8 + uTime * 2.0) * 0.09;
                        y += sin(x * 3.2 + uTime * 2.5) * 0.05;
                        y += sin(z * 3.5 - uTime * 2.2) * 0.05;` : ''}
                        
                        pos.y = y;
                        
                        // Calculate normal for better lighting
                        float dx = cos(x * 0.55 + uTime) * 0.55 * 0.22;
                        float dz = cos(z * 0.8 + uTime * 0.9) * 0.8 * 0.18;
                        vNormal = normalize(vec3(-dx, 1.0, -dz));
                        
                        vElevation = (y + 0.7) / 1.4;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;
                const fs = `
                    uniform vec3 uColorDeep, uColorMid, uColorShallow, uColorFoam;
                    varying float vElevation;
                    varying vec3 vNormal;
                    void main() {
                        float t = clamp(vElevation, 0.0, 1.0);
                        vec3 color;
                        if (t < 0.4) color = mix(uColorDeep, uColorMid, t/0.4);
                        else if (t < 0.75) color = mix(uColorMid, uColorShallow, (t-0.4)/0.35);
                        else color = mix(uColorShallow, uColorFoam, (t-0.75)/0.25);
                        
                        // Enhanced lighting with normal
                        vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));
                        float lightIntensity = max(0.3, dot(vNormal, lightDir));
                        color *= lightIntensity;
                        
                        float sparkle = smoothstep(0.75, 0.95, t) * 0.5;
                        color += vec3(sparkle * 0.4, sparkle * 0.5, sparkle * 0.7);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `;
                return new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs, side: THREE.DoubleSide });
            }
            update(t) { this.material.uniforms.uTime.value = t; }
            addToScene(scene) { scene.add(this.mesh); }
        }

        // ========== 2. ParticleSystem (ประกายแสงบนน้ำ) ==========
        class ParticleSystem {
            constructor(count = CONFIG.particles.count, range = 22) {
                const geom = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    pos[i*3] = (Math.random() - 0.5) * range;
                    pos[i*3+1] = Math.random() * 1.2 + 0.5;
                    pos[i*3+2] = (Math.random() - 0.5) * range;
                }
                geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.05, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
                this.points = new THREE.Points(geom, mat);
            }
            addToScene(scene) { scene.add(this.points); }
            update(t) {
                this.points.rotation.y = t * 0.05;
                this.points.rotation.x = Math.sin(t * 0.2) * 0.1;
            }
        }

        // ========== 3. Lighthouse (ประภาคาร) ==========
        class Lighthouse {
            constructor(x = 6, z = -5) {
                this.group = new THREE.Group();
                // ฐานทุ่นสีขาว
                const baseCylinder = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.95, 1.3, 0.5, 32),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.1 })
                );
                baseCylinder.position.y = 0.25;
                this.group.add(baseCylinder);
                
                const bottomDome = new THREE.Mesh(
                    new THREE.SphereGeometry(1.3, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.1 })
                );
                bottomDome.position.y = 0;
                this.group.add(bottomDome);
                
                const connectingTower = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.6, 0.85, 1.3, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.1 })
                );
                connectingTower.position.y = 1.15;
                this.group.add(connectingTower);
                
                // เสาหลัก - สีแดงพื้น
                const tower = new THREE.Mesh(

                this.redLight.position.set(0, 3.15, 0);
                this.group.add(this.redLight);
                
                // Sprite รัศมี
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;

                ctx.fillStyle = '#ff0000';
                ctx.arc(32, 32, 28, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#ff6666';
                ctx.arc(32, 32, 16, 0, 2 * Math.PI);
                ctx.fill();
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map: texture, blending: THREE.AdditiveBlending, transparent: true, opacity: 0 });
                this.lightSprite = new THREE.Sprite(spriteMaterial);
                this.lightSprite.scale.set(1.8, 1.8, 1);
                this.lightSprite.position.set(0, 3.15, 0);
                this.group.add(this.lightSprite);
                
                this.blinkSpeed = 1.2;
                this.swayAmp = 0.08;
                this.swaySpeed = 1.5;
                this.bobAmp = 0.08;
                this.bobSpeed = 1.2;
                
                this.setIntensityMode(true);
                this.group.position.set(x, 0, z);
            }
            
            setIntensityMode(isNight) {
                if (isNight) {
                    this.lightIntensityOn = 8.0;
                    this.bulbEmissiveOn = 5.0;
                    this.spriteOpacityOn = 1.0;
                } else {
                    this.lightIntensityOn = 3.0;
                    this.bulbEmissiveOn = 2.0;
                    this.spriteOpacityOn = 0.6;
                }
            }
            
            addToScene(scene) { scene.add(this.group); }
            
            update(time) {
                this.group.rotation.x = Math.sin(time * this.swaySpeed) * this.swayAmp;
                this.group.rotation.z = Math.cos(time * this.swaySpeed * 0.7) * this.swayAmp;
                this.group.position.y = Math.sin(time * this.bobSpeed) * this.bobAmp;
                
                const interval = 0.5 / this.blinkSpeed;
                const phase = (time % (interval * 2)) / interval;
                const isOn = Math.floor(phase) % 2 === 0;
                
                if (isOn) {
                    this.redLight.intensity = this.lightIntensityOn;
                    this.bulb.material.emissiveIntensity = this.bulbEmissiveOn;
                    this.lightSprite.material.opacity = this.spriteOpacityOn;
                } else {
                    this.redLight.intensity = 0;
                    this.bulb.material.emissiveIntensity = 0;
                    this.lightSprite.material.opacity = 0;
                }
            }
        }

        // ========== 4. CloudSystem (เมฆ) ==========
        class CloudSystem {
            constructor(scene, count = 14) {
                this.scene = scene;
                this.clouds = [];
                this.flashIntensity = 0;
                this.nextFlashTime = Math.random() * 5 + 3;
                
                for (let i = 0; i < count; i++) {
                    const cloudGroup = this._createCloud();
                    const radius = 20 + Math.random() * 20;
                    const angle = Math.random() * Math.PI * 2;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const y = 5 + Math.random() * 6;
                    cloudGroup.position.set(x, y, z);
                    const scale = 0.8 + Math.random() * 1.2;
                    cloudGroup.scale.set(scale, scale * 0.7, scale);
                    cloudGroup.userData = {
                        baseEmissive: 0.05 + Math.random() * 0.1,
                        flickerSpeed: 0.5 + Math.random() * 1.5,
                        flickerPhase: Math.random() * Math.PI * 2
                    };
                    this.scene.add(cloudGroup);
                    this.clouds.push(cloudGroup);
                }
                const bigCloud = this._createCloud(true);
                bigCloud.position.set(-15, 8, -12);
                bigCloud.scale.set(2.5, 1.8, 2);
                bigCloud.userData = { baseEmissive: 0.15, flickerSpeed: 0.8, flickerPhase: 0 };
                this.scene.add(bigCloud);
                this.clouds.push(bigCloud);
            }
            
            _createCloud(isBig = false) {
                const group = new THREE.Group();
                const color = isBig ? 0x886e6e : 0xaaaaaa;
                const glowColor = 0xffaa88;
                const parts = isBig ? [1.2, 1.0, 0.9, 0.8, 0.7] : [0.9, 0.8, 0.7, 0.6, 0.5];
                const offsets = isBig 
                    ? [[0,0,0], [1.0,0.2,0.8], [-0.9,0.1,0.7], [0.5,0.6,0.4], [-0.4,0.5,-0.6], [0.2,-0.3,1.1], [-0.7,-0.2,-0.5]]
                    : [[0,0,0], [0.8,0.1,0.6], [-0.7,0,0.5], [0.4,0.5,0.3], [-0.3,0.4,-0.5], [0.1,-0.2,0.9]];
                parts.forEach((size, idx) => {
                    const offset = offsets[idx % offsets.length];
                    const sphereMat = new THREE.MeshStandardMaterial({
                        color: color,
                        emissive: glowColor,
                        emissiveIntensity: 0.05,
                        roughness: 0.7,
                        metalness: 0.05
                    });
                    const sphere = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), sphereMat);
                    sphere.position.set(offset[0], offset[1] + 0.2, offset[2]);
                    group.add(sphere);
                });
                return group;
            }
            
            update(time, isStormActive) {
                this.clouds.forEach(cloud => {
                    const data = cloud.userData;
                    let intensity = data.baseEmissive;
                    if (isStormActive) {
                        intensity += 0.15 + Math.sin(time * data.flickerSpeed + data.flickerPhase) * 0.1;
                        intensity = Math.min(0.5, intensity);
                    } else {
                        intensity += Math.sin(time * 0.5 + data.flickerPhase) * 0.05;
                    }
                    if (this.flashIntensity > 0) {
                        intensity += this.flashIntensity * 1.5;
                    }
                    cloud.children.forEach(child => {
                        if (child.isMesh && child.material) {
                            child.material.emissiveIntensity = Math.max(0.05, intensity);
                        }
                    });
                });
                if (this.flashIntensity > 0) {
                    this.flashIntensity *= 0.95;
                    if (this.flashIntensity < 0.01) this.flashIntensity = 0;
                }
            }
            
            triggerLightning() {
                this.flashIntensity = 0.8 + Math.random() * 0.5;
                log("⚡ ฟ้าผ่า!");
                return this.flashIntensity;
            }
            
            getFlashIntensity() { return this.flashIntensity; }
        }

        // ========== 5. RainSystem (ฝน) ==========
        class RainSystem {
            constructor(scene, count = CONFIG.rain.count) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(count * 3);
                for (let i = 0; i < count; i++) {
                    positions[i*3] = (Math.random() - 0.5) * 40;
                    positions[i*3+1] = Math.random() * 15;
                    positions[i*3+2] = (Math.random() - 0.5) * 30 - 5;
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const material = new THREE.PointsMaterial({ color: 0xaaddff, size: 0.08, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
                this.points = new THREE.Points(geometry, material);
                scene.add(this.points);
                this.count = count;
                this.originalPositions = positions.slice();
                this.isRaining = false;
            }
            
            setRainActive(active) {
                this.isRaining = active;
                this.points.material.opacity = active ? 0.6 : 0;
                if (!active) {
                    const posAttr = this.points.geometry.attributes.position.array;
                    for (let i = 0; i < this.count; i++) {
                        posAttr[i*3] = this.originalPositions[i*3];
                        posAttr[i*3+1] = this.originalPositions[i*3+1];
                        posAttr[i*3+2] = this.originalPositions[i*3+2];
                    }
                    this.points.geometry.attributes.position.needsUpdate = true;
                }
            }
            
            update(deltaTime) {
                if (!this.isRaining) return;
                const positions = this.points.geometry.attributes.position.array;
                for (let i = 0; i < this.count; i++) {
                    positions[i*3+1] -= deltaTime * CONFIG.rain.fallSpeed;
                    if (positions[i*3+1] < 0) {
                        positions[i*3+1] = 12 + Math.random() * 3;
                        positions[i*3] = (Math.random() - 0.5) * 40;
                        positions[i*3+2] = (Math.random() - 0.5) * 30 - 5;
                    }
                }
                this.points.geometry.attributes.position.needsUpdate = true;
            }
        }

        // Use the more detailed Fish class (thin-plate fins, crescent pectorals) and a simple system wrapper

                const dorsalShape = new THREE.Shape();

                dorsalShape.quadraticCurveTo(size * 0.2, size * 0.6, -size * 0.55, size * 0.15);
                dorsalShape.lineTo(-size * 0.45, 0);
                const dorsalGeo = new THREE.ExtrudeGeometry(dorsalShape, { depth: size * 0.04, bevelEnabled: false });
                const dorsalMesh = new THREE.Mesh(dorsalGeo, finMat);
                dorsalMesh.position.set(0, size * 0.62, -size * 0.02);
                dorsalMesh.rotation.z = 0.03;
                this.group.add(dorsalMesh);

                // ครีบหลังท่อนที่ 2
                const dorsalShape2 = new THREE.Shape();

                dorsalShape2.quadraticCurveTo(-size * 0.35, size * 0.4, -size * 0.85, size * 0.08);
                dorsalShape2.lineTo(-size * 0.75, 0);
                const dorsalGeo2 = new THREE.ExtrudeGeometry(dorsalShape2, { depth: size * 0.035, bevelEnabled: false });
                const dorsalMesh2 = new THREE.Mesh(dorsalGeo2, finMat);
                dorsalMesh2.position.set(-size * 0.3, size * 0.48, -size * 0.015);
                this.group.add(dorsalMesh2);

                // ===== 5. ครีบท้อง (แผ่นบาง) =====
                const ventralShape = new THREE.Shape();
                ventralShape.moveTo(size * 0.25, 0);
                ventralShape.quadraticCurveTo(size * 0.05, -size * 0.5, -size * 0.55, -size * 0.12);

                const pectoralTailShape = new THREE.Shape();
                pectoralTailShape.moveTo(0, 0);
                pectoralTailShape.quadraticCurveTo(-size * 0.18, size * 0.34, -size * 0.45, size * 0.3);
                pectoralTailShape.quadraticCurveTo(-size * 0.32, 0, -size * 0.45, -size * 0.3);
                pectoralTailShape.quadraticCurveTo(-size * 0.18, -size * 0.34, 0, 0);
                const pectoralGeo = new THREE.ExtrudeGeometry(pectoralTailShape, { depth: size * 0.03, bevelEnabled: false });

                pectoralRight.rotation.x = 0.0;
                pectoralRight.scale.set(0.75, 0.75, 0.75);

                // ตำแหน่งเริ่มต้น: วางปลาใกล้ทุ่น/ประภาคาร (BUOY_POS)
                // spawn radius larger so fishes are more spread around the buoy
                const startRadius = 6 + Math.random() * 6; // 6..12
                const startAngle = Math.random() * Math.PI * 2;
                const px = BUOY_POS.x + Math.cos(startAngle) * startRadius;
                const pz = BUOY_POS.z + Math.sin(startAngle) * startRadius;
                const py = BUOY_POS.y + (Math.random() - 0.5) * 1.6;
                this.group.position.set(px, Math.max(BOUNDS.y.min, Math.min(BOUNDS.y.max, py)), pz);

                this.setNewTarget();
                scene.add(this.group);
            }

            setNewTarget() {
                // Check if target would be outside bounds before setting
                let newTarget;
                let attempts = 0;
                do {
                    newTarget = {
                        x: BUOY_POS.x + (Math.random() - 0.5) * 12,
                        y: Math.max(BOUNDS.y.min + 0.5, Math.min(BOUNDS.y.max - 0.5, BUOY_POS.y + (Math.random() - 0.5) * 2.5)),
                        z: BUOY_POS.z + (Math.random() - 0.5) * 12
                    };
                    attempts++;
                } while (attempts < 5 && (
                    newTarget.x < BOUNDS.x.min + 1 || newTarget.x > BOUNDS.x.max - 1 ||
                    newTarget.z < BOUNDS.z.min + 1 || newTarget.z > BOUNDS.z.max - 1
                ));
                
                if (!this.target) this.target = new THREE.Vector3();
                this.target.set(newTarget.x, newTarget.y, newTarget.z);
            }

            update(t, delta, isPaused) {
                if (isPaused) return;

                this._tempVec.subVectors(this.target, this.group.position).normalize();
                const angleToTarget = Math.atan2(this._tempVec.x, this._tempVec.z);
                // Safe angle difference to prevent jitter
                let angDiff = angleToTarget - this.group.rotation.y;
                angDiff = Math.atan2(Math.sin(angDiff), Math.cos(angDiff));
                this.group.rotation.y += angDiff * CONFIG.fish.turnSpeed;

                const forwardX = Math.sin(this.group.rotation.y);
                const forwardZ = Math.cos(this.group.rotation.y);
                this.group.position.x += forwardX * this.speed * delta;
                this.group.position.z += forwardZ * this.speed * delta;
                this.group.position.y += this._tempVec.y * 0.6 * delta;

                // Smooth boundary clamping to prevent jitter
                const margin = 1.0;
                if (this.group.position.x < BOUNDS.x.min + margin || this.group.position.x > BOUNDS.x.max - margin ||
                    this.group.position.z < BOUNDS.z.min + margin || this.group.position.z > BOUNDS.z.max - margin) {
                    this.setNewTarget(); // Get new target before hitting boundary
                }
                
                this.group.position.x = Math.max(BOUNDS.x.min, Math.min(BOUNDS.x.max, this.group.position.x));
                this.group.position.z = Math.max(BOUNDS.z.min, Math.min(BOUNDS.z.max, this.group.position.z));
                this.group.position.y = Math.max(BOUNDS.y.min, Math.min(BOUNDS.y.max, this.group.position.y));

                if (this.tailGroup) {
                    this.tailGroup.rotation.y = Math.sin(t * 13) * 0.4;
                }

                // gentle bob scaled by time
                this.group.position.y += Math.sin(t * 3.8) * CONFIG.fish.swimBob;

                // Use squared distance to avoid expensive sqrt
                const distSq = this.group.position.distanceToSquared(this.target);
                if (distSq < (CONFIG.fish.targetThreshold * CONFIG.fish.targetThreshold) || Math.random() < 0.004) {
                    this.setNewTarget();
                }
            }
        }

        class FishSystem {
            constructor(scene, count = CONFIG.fish.maxCount) {
                this.scene = scene;
                this.fishes = [];
                const colors = [0xff6666, 0x66ff66, 0x6666ff, 0xffaa66, 0xff66ff];
                const sizes = [0.25, 0.35, 0.45, 0.3, 0.4];
                const baseAngle = Math.random() * Math.PI * 2;
                for (let i = 0; i < count; i++) {
                    const f = new Fish(colors[i % colors.length], sizes[i % sizes.length], scene);
                    // arrange fish around buoy with even angular spacing + jitter to avoid overlap
                    const angle = baseAngle + (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
                    const radius = 6 + i * 1.8 + Math.random() * 2; // staggered radii
                    const px = BUOY_POS.x + Math.cos(angle) * radius;
                    const pz = BUOY_POS.z + Math.sin(angle) * radius;
                    const py = BUOY_POS.y + (Math.random() - 0.5) * 1.6;
                    f.group.position.set(px, Math.max(BOUNDS.y.min, Math.min(BOUNDS.y.max, py)), pz);
                    // set an initial target a bit wider so they roam apart
                    f.setNewTarget();
                    this.fishes.push(f);
                }
            }

            update(time, delta) {
                this.fishes.forEach(f => f.update(time, delta, false));
            }
        }
        
        // ========== 7. Main App ==========
        class OceanSceneApp {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.composer = null;
                this.bloomPass = null;
                this.ocean = null;
                this.particles = null;
                this.lighthouse = null;
                this.cloudSystem = null;
                this.rainSystem = null;
                this.ambientLight = null;
                this.directionalLight = null;
                this.isNight = true;
                this.isStormActive = false;
                this.lastTime = 0;
                this.lightningTimer = 0;
                this.lightningIntensity = 0.6; // For smooth transition
                this.targetLightningIntensity = 0.6;
                
                // Reduced motion support
                this.prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            }
            
            init() {
                this.scene.background = new THREE.Color(0x1a2a4a);
                this.scene.fog = new THREE.FogExp2(0x1a2a4a, 0.015);
                
                this.camera.position.set(9, 5.5, 10);
                this.camera.lookAt(4, 0, -3);
                
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                document.body.appendChild(this.renderer.domElement);
                
                // WebGL context lost handling
                this.renderer.domElement.addEventListener('webglcontextlost', (e) => {
                    e.preventDefault();
                    log("⚠️ WebGL context lost - กรุณารีโหลดหน้าเว็บ");
                    if (confirm("WebGL หยุดทำงาน\nต้องการรีโหลดหน้าเว็บไหม?")) {
                        location.reload();
                    }
                }, false);
                
                const controls = new OrbitControls(this.camera, this.renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.rotateSpeed = 1.0;
                controls.target.set(4, 1.5, -3);
                this.controls = controls;
                
                this.ambientLight = new THREE.AmbientLight(0x335588, 0.45);
                this.scene.add(this.ambientLight);
                this.directionalLight = new THREE.DirectionalLight(0xccaa88, 0.6);
                this.directionalLight.position.set(5, 12, 8);
                this.scene.add(this.directionalLight);
                
                this.ocean = new OceanPlane(24, 24, CONFIG.ocean.segments);
                this.ocean.addToScene(this.scene);
                this.particles = new ParticleSystem(CONFIG.particles.count, 22);
                this.particles.addToScene(this.scene);
                this.lighthouse = new Lighthouse(5, -4);
                this.lighthouse.addToScene(this.scene);
                
                this.cloudSystem = new CloudSystem(this.scene, 14);
                this.rainSystem = new RainSystem(this.scene, CONFIG.rain.count);
                this.fishSystem = new FishSystem(this.scene, CONFIG.fish.maxCount);
                
                // Bloom effect - ตั้งค่า threshold = 1 ตามที่ขอ
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                this.bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.6, 1.0);
                this.composer.addPass(this.bloomPass);
                
                // GUI with organized folders
                this.settings = {
                    // Performance
                    oceanSegments: CONFIG.ocean.segments,
                    particleCount: CONFIG.particles.count,
                    fishCount: CONFIG.fish.maxCount,
                    
                    // Bloom
                    bloomEnabled: true,
                    bloomStrength: 1.2,
                    bloomRadius: 0.6,
                    bloomThreshold: 1.0,
                    
                    // Scene
                    dayNightMode: 'Night',
                    stormMode: false
                };
                
                const gui = new GUI();
                gui.close(); // Start closed
                gui.title('🌩️ Ocean Controls');
                
                // Performance Folder
                const perfFolder = gui.addFolder('⚡ Performance');
                perfFolder.add(this.settings, 'oceanSegments', 50, 300, 10).name('Ocean Quality').onChange(v => {
                    log(`Ocean segments: ${v} (requires reload)`);
                    if (confirm(`เปลี่ยน Ocean Quality เป็น ${v}\nต้องรีโหลดหน้าเพื่อมีผล ต้องการรีโหลดไหม?`)) {
                        location.reload();
                    }
                });
                perfFolder.add(this.settings, 'particleCount', 200, 2000, 100).name('Particles').onChange(v => {
                    log(`Particles: ${v} (requires reload)`);
                    if (confirm(`เปลี่ยน Particles เป็น ${v}\nต้องรีโหลดหน้าเพื่อมีผล ต้องการรีโหลดไหม?`)) {
                        location.reload();
                    }
                });
                perfFolder.add(this.settings, 'fishCount', 3, 20, 1).name('Fish Count').onChange(v => {
                    log(`Fish: ${v} (requires reload)`);
                    if (confirm(`เปลี่ยน Fish Count เป็น ${v}\nต้องรีโหลดหน้าเพื่อมีผล ต้องการรีโหลดไหม?`)) {
                        location.reload();
                    }
                });
                
                // Bloom Effects Folder
                const bloomFolder = gui.addFolder('💡 Bloom Effects');
                bloomFolder.add(this.settings, 'bloomEnabled').name('Enable Bloom').onChange(v => {
                    log(v ? 'Bloom ON' : 'Bloom OFF');
                });
                bloomFolder.add(this.settings, 'bloomStrength', 0, 3, 0.05).name('Strength').onChange(v => {
                    if(this.bloomPass) this.bloomPass.strength = v;
                });
                bloomFolder.add(this.settings, 'bloomRadius', 0, 1, 0.05).name('Radius').onChange(v => {
                    if(this.bloomPass) this.bloomPass.radius = v;
                });
                bloomFolder.add(this.settings, 'bloomThreshold', 0, 2, 0.02).name('Threshold').onChange(v => {
                    if(this.bloomPass) this.bloomPass.threshold = v;
                });
                
                // Scene Controls Folder
                const sceneFolder = gui.addFolder('🌍 Scene Controls');
                sceneFolder.add(this.settings, 'dayNightMode', ['Day', 'Night']).name('Time of Day').onChange(v => {
                    this.isNight = v === 'Night';
                    this.setDayNightMode(this.isNight);
                    document.getElementById('daynightBtn').innerHTML = this.isNight ? '🌙 กลางคืน' : '☀️ กลางวัน';
                });
                sceneFolder.add(this.settings, 'stormMode').name('Storm Active').onChange(v => {
                    if (v !== this.isStormActive) this.toggleStorm();
                });
                
                // Info Folder
                const infoFolder = gui.addFolder('ℹ️ Information');
                const deviceInfo = {
                    device: window.innerWidth < 768 ? 'Mobile' : 'Desktop',
                    resolution: `${window.innerWidth}×${window.innerHeight}`,
                    renderer: this.renderer.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1'
                };
                infoFolder.add(deviceInfo, 'device').name('Device').listen();
                infoFolder.add(deviceInfo, 'resolution').name('Resolution').listen();
                infoFolder.add(deviceInfo, 'renderer').name('Renderer').listen();
                
                // Close all folders initially except scene controls
                perfFolder.close();
                bloomFolder.close();
                infoFolder.close();
                
                const btnDayNight = document.getElementById('daynightBtn');
                btnDayNight.addEventListener('click', () => this.toggleDayNight());
                const btnStorm = document.getElementById('stormBtn');
                btnStorm.addEventListener('click', () => this.toggleStorm());
                
                this.setDayNightMode(true);
                log("✅ พร้อมใช้งาน | ปลา 15 ตัวกำลังว่ายน้ำ | Threshold default = 1");
                
                window.addEventListener('resize', () => this.onResize());
                this.animate();
            }
            
            toggleStorm() {
                this.isStormActive = !this.isStormActive;
                this.settings.stormMode = this.isStormActive; // Sync with GUI
                const btn = document.getElementById('stormBtn');
                if (this.isStormActive) {
                    btn.innerHTML = '🌧️ ปิดพายุฝน';
                    btn.style.background = '#335577';
                    this.rainSystem.setRainActive(true);
                    this.scene.fog.density = 0.025;
                    this.ambientLight.intensity = 0.35;
                    this.directionalLight.intensity = 0.3;
                    log("⛈️ เปิดโหมดพายุฝน - เมฆเรืองแสง ฟ้าผ่า");
                } else {
                    btn.innerHTML = '⛈️ เปิดพายุฝน';
                    btn.style.background = '#331100';
                    this.rainSystem.setRainActive(false);
                    this.scene.fog.density = 0.012;
                    this.ambientLight.intensity = 0.45;
                    this.directionalLight.intensity = 0.6;
                    log("☁️ ปิดพายุฝน");
                }
            }
            
            toggleDayNight() {
                this.isNight = !this.isNight;
                this.settings.dayNightMode = this.isNight ? 'Night' : 'Day'; // Sync with GUI
                this.setDayNightMode(this.isNight);
                const btn = document.getElementById('daynightBtn');
                if (this.isNight) {
                    btn.innerHTML = '🌙 กลางคืน';
                    btn.style.background = 'rgba(0,0,0,0.8)';
                    btn.style.color = 'white';
                } else {
                    btn.innerHTML = '☀️ กลางวัน';
                    btn.style.background = 'rgba(255,200,100,0.8)';
                    btn.style.color = '#333';
                }
            }
            
            setDayNightMode(isNight) {
                if (isNight) {
                    this.scene.background.setHex(0x0a1a3a);
                    this.scene.fog.color.setHex(0x0a1a3a);
                    this.ambientLight.intensity = 0.35;
                    this.directionalLight.intensity = 0.4;
                    this.directionalLight.color.setHex(0x6688aa);
                    if (this.bloomPass) this.bloomPass.strength = 1.5;
                } else {
                    this.scene.background.setHex(0x87CEEB);
                    this.scene.fog.color.setHex(0x87CEEB);
                    this.ambientLight.intensity = 0.7;
                    this.directionalLight.intensity = 1.0;
                    this.directionalLight.color.setHex(0xffeedd);
                    if (this.bloomPass) this.bloomPass.strength = 0.9;
                }
                this.lighthouse.setIntensityMode(isNight);
            }
            
            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                if (this.composer) this.composer.setSize(window.innerWidth, window.innerHeight);
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                const time = performance.now() / 1000;
                const delta = Math.min(0.033, time - (this.lastTime || time));
                this.lastTime = time;
                
                this.ocean.update(time * 1.2);
                this.particles.update(time);
                this.lighthouse.update(time);
                this.rainSystem.update(delta);
                this.fishSystem.update(time, delta);
                
                if (this.isStormActive) {
                    if (time > this.lightningTimer) {
                        this.lightningTimer = time + 3 + Math.random() * 5;
                        const flash = this.cloudSystem.triggerLightning();
                        this.targetLightningIntensity = 0.6 + flash * 0.8;
                        // Reset target after flash duration
                        setTimeout(() => {
                            this.targetLightningIntensity = this.isStormActive ? 0.3 : 0.6;
                        }, 150);
                    }
                    
                    // Smooth lightning intensity transition
                    this.lightningIntensity = THREE.MathUtils.lerp(this.lightningIntensity, this.targetLightningIntensity, delta * 8);
                    this.directionalLight.intensity = this.lightningIntensity;
                } else {
                    this.lightningIntensity = THREE.MathUtils.lerp(this.lightningIntensity, 0.6, delta * 2);
                    this.directionalLight.intensity = this.lightningIntensity;
                }
                
                this.cloudSystem.update(time, this.isStormActive);
                
                if (this.settings.bloomEnabled && this.composer) {
                    this.bloomPass.strength = this.settings.bloomStrength;
                    this.bloomPass.radius = this.settings.bloomRadius;
                    this.bloomPass.threshold = this.settings.bloomThreshold;
                    this.composer.render();
                } else {
                    this.renderer.render(this.scene, this.camera);
                }
                
                this.controls.update();
            }
            
            // Resource disposal for memory management
            dispose() {
                if (this.ocean) {
                    this.ocean.geometry && this.ocean.geometry.dispose();
                    this.ocean.material && this.ocean.material.dispose();
                }
                if (this.particles) {
                    this.particles.points.geometry && this.particles.points.geometry.dispose();
                    this.particles.points.material && this.particles.points.material.dispose();
                }
                if (this.rainSystem) {
                    this.rainSystem.points.geometry && this.rainSystem.points.geometry.dispose();
                    this.rainSystem.points.material && this.rainSystem.points.material.dispose();
                }
                if (this.lighthouse) {
                    this.lighthouse.group.traverse(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(mat => mat.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
                // Dispose shared fish resources
                Object.values(FishGeometryCache).forEach(geo => {
                    if (geo && geo.dispose) geo.dispose();
                });
                FishMaterialCache.body.forEach(mat => mat.dispose());
                FishMaterialCache.fin.forEach(mat => mat.dispose());
                FishMaterialCache.eye.forEach(mat => mat.dispose());
                
                if (this.renderer) {
                    this.renderer.dispose();
                }
            }
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (window.__oceanApp) {
                window.__oceanApp.dispose();
            }
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            initControlHints(); // Initialize control hints
            const app = new OceanSceneApp();
            app.init();
            window.__oceanApp = app; // Store for cleanup
            log(`✅ พร้อมใช้งาน | ปลา ${CONFIG.fish.maxCount} ตัวกำลังว่ายน้ำ | Optimized for ${window.innerWidth < 768 ? 'Mobile' : 'Desktop'}`);
        });
    </script>
